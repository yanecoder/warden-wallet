{% extends "base.html" %}
{% block content %}
<div class="flex min-h-screen bg-[#161616] text-white font-montserrat">

  {% include "sidebar.html" %}

  <main class="flex-1 flex flex-col items-center justify-center bg-[#161616] p-10">
    {% include "nav.html" %}

    <h2 class="text-2xl font-bold mb-6">Receive</h2>

    <img src="{{ url_for('static', filename='qr/qr_code.png') }}?{{ salt }}" alt="QR Code" class="mb-4 w-48 h-48" />

    <div class="flex items-center space-x-2 mb-4">
      <p class="font-mono text-sm">{{ address }}</p>
      <button onclick="copyToClipboard()" class="text-gray-400 hover:text-white" title="Copy">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke-width="2"/>
          <rect x="3" y="3" width="13" height="13" rx="2" ry="2" stroke-width="2"/>
        </svg>
      </button>
    </div>

    <p class="text-yellow-400 text-xs">
      ⚠️ Send more than 1.1 XRP to activate account first time.
    </p>
  </main>
</div>
{% include "settings.html" %}

<script>
function copyToClipboard() {
    navigator.clipboard.writeText("{{ address }}");
}
</script>
{% endblock %}
