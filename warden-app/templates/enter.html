{% extends 'base.html' %}

{% block content %}
<div class="bg-[#161616] text-white font-montserrat min-h-screen flex flex-col items-center justify-center">
    <a href="/"
        class="absolute top-4 left-4 text-gray-400 hover:text-white transition text-sm">
        <i class="fas fa-arrow-left mr-1"></i> Back
    </a>
    
    <h1 class="text-xl mb-4">Seed phrase</h1>
    {% include 'nav.html' %}
    <form method="POST" action="/enter" class="flex flex-col items-center w-full max-w-sm">
        <input type="text" name="mnemonic" id="mnemonic"
               class="w-full p-2 rounded bg-[#2a2a2a] text-white placeholder-gray-400 focus:outline-none mb-4 font-mono"
               placeholder="Enter your seed phrase" required />

        <button type="submit"
                class="bg-[#2a2a2a] hover:bg-[#3a3a3a] text-white px-6 py-2 rounded font-bold transition">
            set
        </button>
    </form>

    {% if error %}
    <p class="text-red-400 text-xs mt-4">{{ error }}</p>
    {% endif %}

</div>
{% include "settings.html" %}
{% endblock %}
